[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# short links to the event page - all land on /unburden
[[redirects]]
  from = "/event"
  to = "/unburden/"
  status = 301
[[redirects]]
  from = "/register"
  to = "/unburden/#register"
  status = 301
[[redirects]]
  from = "/faves"
  to = "/unburden/"
  status = 301

[[headers]]
  for = "/unburden/unburden.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = "attachment; filename=\"favour-and-faves-unburden.ics\""

# ---- keep the project's own files off the public web ----
# (the site publishes from the project folder, so without these the
#  server code, README and package files would be downloadable)
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/get-covers.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/images/covers/README.txt"
  to = "/404.html"
  status = 404
  force = true

# ---- security headers on every page ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# ---- photos, video and fonts rarely change: let phones keep them a week,
#      so repeat visits on mobile data are near-instant ----
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# the door and release pages are private
[[headers]]
  for = "/unburden/door/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/unburden/release/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[redirects]]
  from = "/GO-LIVE.md"
  to = "/404.html"
  status = 404
  force = true
[[headers]]
  for = "/unburden/walkin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/unburden/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[redirects]]
  from = "/GO-LIVE.command"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
